<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="form.css" />
  </head>
  <body>
    <div>
      <form id="form-submit">
        <div class="container">
          <div class="inner_container">
            <label for="first_name">First Name</label>
            <input type="text" id="first_name" class="input_form" />
          </div>

          <div class="inner_container">
            <label for="last_name">Last Name</label>
            <input type="text" id="last_name" class="input_form" />
          </div>
        </div>

        <select>
          <option value="1">one</option>
          <option value="2">Two</option>
        </select>

        <label>Skill</label>

        <input type="checkbox"/>

        <input type="password"/>

        <button type="submit">Submit</button>
      </form>

      <div>Frist Name : <span id="first_name_value"></span></div>
      <div>Last Name : <span id="last_name_value"></span></div>
    </div>

    <script>
      const form = document.getElementById("form-submit"); // i got form tag details

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        const firstName = document.getElementById("first_name").value;
        const lastName = document.getElementById("last_name").value;

        if (!firstName) {
          alert("Please enter the first name");
        }
        if (!lastName) {
          alert("Please enter the last name");
        }

        const displayFirstName = document.getElementById("first_name_value");
        displayFirstName.innerText = firstName;

        const displayLastName = document.getElementById("last_name_value");
        displayLastName.innerText = lastName;
        //we will call another function when we get first name and last
        console.log(
          firstName,
          lastName,
          "we will call another function when we get first name and last"
        );

        console.log("hi");
      });
    </script>
  </body>
</html>
